services:
  homepage:
    image: proxmox-homepage/homepage:local
    build:
      context: ./homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "homepage.vm.nic.lan,homepage.vm.nic.lan:${HTTP_PORT:-80},localhost,localhost:${HTTP_PORT:-80},127.0.0.1,127.0.0.1:${HTTP_PORT:-80}"
      LOG_TARGETS: stdout

  nginx:
    image: proxmox-homepage/nginx:local
    build:
      context: ./nginx
    depends_on:
      - homepage
    ports:
      # Dashboard ingress only; service cards link directly to their own hosts.
      - "0.0.0.0:${HTTP_PORT:-80}:80"
