services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    volumes:
      # Homepage may create supporting config files here on first start.
      - ./homepage:/app/config
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "localhost:${HTTP_PORT:-8080},127.0.0.1:${HTTP_PORT:-8080}"
      HOMEPAGE_VAR_HTTP_PORT: "${HTTP_PORT:-8080}"
      LOG_TARGETS: stdout

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - homepage
    ports:
      # Local MVP only: not published on LAN/public interfaces.
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
