# Loaded in the stock Nginx image's http context via conf.d/default.conf.
server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://homepage:3000;
        proxy_http_version 1.1;
        # Preserve the published port for Homepage's explicit host allowlist.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# FUTURE ROUTING ONLY: .invalid is reserved and will not resolve in normal DNS.
# No VM is contacted. Explicit 503 responses keep placeholders honest and allow
# Homepage to start without DNS/upstream addresses for undeployed services.
# After deployment, replace each server_name, remove its return 503, and add a
# location / block using the corresponding commented proxy_pass template.
# Review TLS trust, authentication, proxy headers and any WebSocket/upload
# requirements for the actual service before enabling access. No TLS bypass here.
server {
    listen 80;
    server_name proxmox.home.invalid;
    default_type text/plain;
    return 503 "proxmox: NOT DEPLOYED - configure internal hostname and VM upstream first.\n";
    # location / {
    #     proxy_pass https://PROXMOX_VM_ADDRESS:8006;
    #     proxy_ssl_verify on;
    #     proxy_ssl_trusted_certificate /PATH_TO_APPROVED_CA_BUNDLE;
    # }
}

