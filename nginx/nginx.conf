# Loaded in the stock Nginx image's http context via conf.d/default.conf.
server {
    listen 80 default_server;
    server_name homepage.vm.nic.lan localhost;

    location / {
        proxy_pass http://homepage:3000;
        proxy_http_version 1.1;
        # Preserve the published port for Homepage's explicit host allowlist.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
