# Local display widgets only; no API credentials or service polling.
- greeting:
    text: Nic's HomeLab
    text_size: 2xl
- datetime:
    text_size: md
    locale: en-GB
    format:
      weekday: short
      month: short
      day: numeric
      hour: 2-digit
      minute: 2-digit
      hourCycle: h23
      timeZone: Asia/Seoul
